[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manifold-rank-fusion"
version = "0.1.0"
description = "Aggregating neighbor embedding projection and rank-based manifold learning for image retrieval"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "umap-learn>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]
